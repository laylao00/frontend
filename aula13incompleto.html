<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 13</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture><!--Usado para fazer imagem responsivas ou seja que se adaptam--> <source media="(max-width: 750px)" 
        srcset="imagens/Flamengo-Pedro-Fluminense-e1753058755121.webp" type="imagem/png"> <!--source define o tamanho da imagem que vai abrir, 
            srcset é usado para definir o arquivo de imagem e o type define o tipo de imagem-->
            <source media="(max-width: 1050px)" srcset="imagens/54976598995_1de47fc020_k-aspect-ratio-512-320.png" type="imagem/png">
            <img src="imagens/Pedro-Flamengo-800x800.webp" alt="imagem flexível">
    </picture>
</body>
</html>
