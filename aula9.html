<body>
    <h1>Trabalhando com listas</h1>
    <h2>Listas ordenadas</h2>
    <ol type="A" start="1"> <!-- 1 A a I i--> <!--ol é usado em listas ordenadas o type 
        é usado para escolher o tipo da lista e o star de qual item vai começar-->
        <li>Laylon</li> <!--li: É usado para criar um item de lista-->
        <li>Nolyal</li>
        <h3>Dia-a-Dia</h3>
        <li>Acordar</li> 
        <li>Ligar para o João</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
        <li>Ir para a faculdade</li>
        <li>Almoçar</li>
        <li>Ir para o trabalho</li>
        <li>Voltar para casa</li>
        <li>Dormir</li>
    </ol>
</body>
